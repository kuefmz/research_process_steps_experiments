[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-process-steps"
version = "0.1.0"
description = "Deterministic heuristics for identifying research process steps from GitHub repository files"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-process-steps = "research_process_steps.analyzer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
