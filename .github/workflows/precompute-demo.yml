name: precompute demo results

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/precompute-demo.yml"
      - "scripts/precompute_demo_results.py"

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Generate SoMEF and WIDOCO results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/precompute_demo_results.py
      - name: Commit generated JSON
        run: |
          if [ -z "$(git status --porcelain -- src/research_process_steps/demo_cache)" ]; then
            echo "Demo result files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_process_steps/demo_cache
          git commit -m "Precompute SoMEF and WIDOCO demo results"
          git push origin HEAD:dev
